[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scorecardpipeline"
dynamic = ["version"]
description = "评分卡pipeline建模包，封装toad、scorecardpy、optbinning等评分卡建模相关组件，API风格与sklearn高度一致，自持自定义模型报告输出"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
authors = [{name = "itlubber", email = "itlubber@qq.com"}]
urls = {Homepage = "https://github.com/itlubber/scorecardpipeline"}
requires-python = ">=3.8"
classifiers = [
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=1.5",
    "matplotlib",
    "seaborn>=0.10.0",
    "scipy>=1.6.0",
    "statsmodels>=0.13.2",
    "scikit-learn>=1.6.0",
    "scorecardpy",
    "ortools>=9.4",
    "ropwr>=1.0.0",
    "optbinning",
    "graphviz>=0.20.1",
    "dtreeviz>=2.2.1",
    "category-encoders>=2.6.0",
    "sklearn-pandas",
    "sklearn2pmml",
    "pypmml",
    "joblib>=0.12",
    "six>=1.15.0",
    "openpyxl>=3.0.10",
    "sweetviz",
    "numexpr",
    "cvxpy>=1.4.1",
    "protobuf>=5.27.0",
    "dill",
    "toad>=0.1.5",
]

[project.optional-dependencies]
all = ["CairoSVG>=2.7.0", "svglib>=1.5.0", "reportlab"]
graph = ["svglib>=1.5.0", "reportlab"]

[tool.setuptools.dynamic]
version = {attr = "scorecardpipeline.__version__"}

[tool.setuptools]
packages = ["scorecardpipeline"]

[tool.setuptools.package-data]
scorecardpipeline = ["*.ttf", "*.csv", "*.xlsx"]