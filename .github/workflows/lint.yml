name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff
        # 仅对新增/显著修改的模块做严格检查，历史代码风格问题不纳入本次 PR 范围
        run: |
          ruff check \
            tests/ \
            scorecardpipeline/explainability.py \
            scorecardpipeline/monitoring.py \
            scorecardpipeline/calibration.py \
            scorecardpipeline/scorecard.py \
            scorecardpipeline/processing.py

      - name: Run black check
        # 仅对新增/显著修改的模块做 black 检查，避免对历史代码产生大量无关 diff
        run: |
          black --check \
            tests/ \
            scorecardpipeline/explainability.py \
            scorecardpipeline/monitoring.py \
            scorecardpipeline/calibration.py \
            scorecardpipeline/scorecard.py
